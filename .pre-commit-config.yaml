repos:
  # Ruff: lint (with safe autofixes) and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^reports/.*\.html$   # Evidently reports are required deliverables
      - id: end-of-file-fixer
        exclude: ^reports/            # generated files are not edited by hand
      - id: trailing-whitespace
        exclude: ^reports/
